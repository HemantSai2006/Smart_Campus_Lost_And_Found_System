server:
  port: 8083

spring:
  application:
    name: MATCHING-SERVICE

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:CampusLostAndFoundSecretKeyForJwtAuthenticationWhichIsVeryLongAndSecure2026!}
  expiration: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html